name: CI

# Inactive until the repository secret LANDRIXXML_TOKEN exists (see the
# submodule step): manual start only. To activate, replace workflow_dispatch
# with push and pull_request.
on:
  workflow_dispatch:

jobs:
  fpc-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check forbidden language features
        run: python3 tools/check-forbidden.py

      - name: Check that the generated code lists are up to date
        run: python3 tools/codelists/gen-codelists.py --check

      # The LandrixXml submodule is a private repository. LANDRIXXML_TOKEN is a
      # fine-grained personal access token with read access (Contents: read) to
      # LandrixSoftware/LandrixXML-for-Pascal only. Pull requests from forks do
      # not receive secrets; for them build and tests are skipped visibly.
      - name: Check out submodules
        env:
          LANDRIXXML_TOKEN: ${{ secrets.LANDRIXXML_TOKEN }}
          FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -z "$LANDRIXXML_TOKEN" ]; then
            if [ "$FROM_FORK" = "true" ]; then
              echo "::warning::Pull request from a fork: no access to the private LandrixXml submodule, build and tests skipped"
              echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::Secret LANDRIXXML_TOKEN is not set (needed for the private LandrixXml submodule)"
            exit 1
          fi
          # -c keeps the token out of every config file (inherited by the submodule clone)
          git -c url."https://x-access-token:${LANDRIXXML_TOKEN}@github.com/LandrixSoftware/LandrixXML-for-Pascal".insteadOf="https://github.com/LandrixSoftware/LandrixXML-for-Pascal" submodule update --init --recursive

      - name: Install Free Pascal
        if: env.SKIP_BUILD != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler fp-units-base
          fpc -iV

      - name: Build tests
        if: env.SKIP_BUILD != 'true'
        run: |
          mkdir -p build/ci
          fpc -B -vewnhi -Fusource -Fuexternal/landrix-xml/source -Futests -Fisource -Fiexternal/landrix-xml/source -FUbuild/ci -FEbuild/ci tests/LandrixEInvoiceTests.dpr | tee build/ci/build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Fail on warnings, hints and notes
        if: env.SKIP_BUILD != 'true'
        run: |
          if grep -E '\.(pas|inc|dpr|lpr)\([0-9]+(,[0-9]+)?\) (Warning|Hint|Note)' build/ci/build.log; then
            exit 1
          fi

      - name: Run tests
        if: env.SKIP_BUILD != 'true'
        run: ./build/ci/LandrixEInvoiceTests "$PWD"

      - name: Build and run tests with overflow and range checking
        if: env.SKIP_BUILD != 'true'
        run: |
          mkdir -p build/ci-checked
          fpc -B -vewnhi -Co -Cr -Fusource -Fuexternal/landrix-xml/source -Futests -Fisource -Fiexternal/landrix-xml/source -FUbuild/ci-checked -FEbuild/ci-checked tests/LandrixEInvoiceTests.dpr | tee build/ci-checked/build.log
          test ${PIPESTATUS[0]} -eq 0
          if grep -E '\.(pas|inc|dpr|lpr)\([0-9]+(,[0-9]+)?\) (Warning|Hint|Note)' build/ci-checked/build.log; then
            exit 1
          fi
          ./build/ci-checked/LandrixEInvoiceTests "$PWD"
