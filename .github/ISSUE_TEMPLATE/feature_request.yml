name: Feature request
description: A format, profile, rule or function you need.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: The use case, and the specification or rule it comes from (with a link if possible).
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: How you work around it now, if at all.
